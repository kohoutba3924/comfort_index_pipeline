version: 2

sources:
  - name: lcdv2
    tables:
      - name: hourly
        # Directory of partitioned Parquet files
        external_location: "../data/normalized/lcdv2/"
        file_format: parquet

      - name: station
        external_location: "../data/external/lcdv2_stations.parquet"
        file_format: parquet

models:
  - name: stg_lcdv2_hourly
    description: >
      Staging model for LCDV2 hourly meteorological observations.
      Raw LCDV2 values are provided in US units (°F, mph, inches, miles, inHg). 
      Elevation and distance are in meters for weighting calculations.
      Observations recorded at subhourly intervals.

    columns:
      - name: station
        description: "WBAN station identifier associated with the subhourly observation."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_lcdv2_station')
                field: station

      - name: timestamp
        description: "Timestamp of the subhourly observation."
        tests:
          - not_null

      - name: dry_bulb_temp

      - name: wet_bulb_temp

      - name: dew_point_temp

      - name: relative_humidity

      - name: wind_speed

      - name: wind_direction

      - name: wind_gust_speed

      - name: precipitation
        description: "Intra-hour accumulated precipitation."

      - name: visibility

      - name: station_pressure

      - name: barometric_pressure


  - name: stg_lcdv2_station
    description: >
      Staging model for LCDV2 station metadata. This model applies type
      casting and preserves station identifiers, names, coordinates,
      elevation, coverage metrics, and date ranges. All fields reflect
      the normalized LCDV2 station metadata produced by the Python
      ingestion pipeline.

    columns:
      - name: station
        description: "WBAN station identifier."
        tests:
          - not_null
          - unique

      - name: name

      - name: latitude

      - name: longitude

      - name: elevation

      - name: data_coverage

      - name: min_date

      - name: max_date
