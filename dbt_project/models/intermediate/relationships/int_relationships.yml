version: 2

models:
  - name: int_prevailing_wind_direction
    description: >
      Computes seasonal prevailing wind direction for each station using
      circular mean of LCDv2 hourly wind direction. Produces one row per
      station per season (DJF, MAM, JJA, SON). This model provides the
      climatological directional component used in the station-tract
      weighting system.

    columns:
      - name: station
        description: >
          Unique identifier for the weather station. Used to join seasonal
          prevailing wind direction to geometry and weighting models.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_station_dim_enriched')
                field: station

      - name: season
        description: >
          Meteorological season assigned based on the month of each hourly
          observation. One of: DJF (winter), MAM (spring), JJA (summer),
          SON (fall). Used to align seasonal climatology with hourly weather
          records during weighting.
        tests:
          - not_null
          - accepted_values:
              values: ['DJF', 'MAM', 'JJA', 'SON']

      - name: prevailing_wind_direction_deg
        description: >
          Circular-mean wind direction for the station during the given
          season, expressed in degrees (0-360). Represents the stable,
          climatological flow pattern used for wind-alignment weighting.
          If seasonal wind direction is not available, a station's overall
          prevailing wind direction is substituted as a fallback. If no 
          wind direction data is reported for a station, this value will 
          be NULL.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 360

    tests:
      - unique:
          column_name: "station || '-' || season"


  - name: int_tract_station_distance
    description: >
      Computes geometric relationships between every station and every census tract,
      including haversine distance, forward-azimuth bearing, and elevation difference.
      This model forms the static spatial foundation for all downstream weighting and
      tract-level aggregation.

    columns:
      - name: station
        description: >
          Unique identifier for the weather station. Used to join geometry to
          prevailing wind direction and weighting models.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_station_dim_enriched')
                field: station

      - name: tract
        description: >
          Unique identifier for the census tract. Used to join geometry to tract-level
          weighting and final weather aggregation.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tract_dim_enriched')
                field: tract

      - name: distance_m
        description: >
          Haversine distance between the station and tract centroid, expressed in
          meters. Represents straight-line geographic separation.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: bearing_deg
        description: >
          Forward azimuth (0-360 degrees) from the station to the tract centroid.
          Represents the direction of the tract relative to the station.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 360

      - name: elevation_diff_m
        description: >
          Difference in elevation between tract and station (tract_elev - station_elev),
          expressed in meters. Used as a penalty factor in weighting.
        tests:
          - not_null

    tests:
      - unique:
          column_name: "station || '-' || tract"


  - name: int_station_weights
    description: >
      Computes seasonal station-to-tract influence weights using wind alignment,
      elevation penalty, and a linear distance taper applied only within a 50 km
      relevance threshold. Includes fallback logic for tracts without stations
      inside the threshold by selecting the nearest station. Produces normalized
      weights per station, tract, and season, along with an auditable record of
      all stations contributing to each tract-season weighting.

    columns:
      - name: station
        description: >
          Identifier of the station contributing to the tract's seasonal weight.
          Only stations within 50 km of the tract centroid are included, unless
          fallback logic selects the nearest station.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_station_dim_enriched')
                field: station

      - name: tract
        description: >
          Census tract receiving weighted station influence. Each tract has one
          or more contributing stations per season, depending on proximity.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tract_dim_enriched')
                field: tract

      - name: season
        description: >
          Meteorological season (DJF, MAM, JJA, SON) used to align climatological
          prevailing wind direction with tract-level weighting.
        tests:
          - not_null
          - accepted_values:
              values: ['DJF', 'MAM', 'JJA', 'SON']

      - name: wind_alignment
        description: >
          Alignment score (0-1) between seasonal prevailing wind direction and
          station-to-tract bearing. Higher values indicate stronger directional
          influence.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1

      - name: elevation_penalty
        description: >
          Penalty factor (0-1) based on elevation difference between station and
          tract. Higher penalties reduce influence from stations at mismatched
          elevations.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1

      - name: distance_factor
        description: >
          Linear taper factor (0-1) applied only within 50 km. Computed as
          1 - (distance_m / 50000). Stations beyond 50 km receive a factor of 0.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1

      - name: raw_weight
        description: >
          Scientifically grounded raw weight computed as (0.6 * distance_factor) + 
          (0.3 * elevation_penalty) + (0.1 * wind_alignment). 
          Represents the station's relative influence beforenormalization.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1

      - name: final_weight
        description: >
          Normalized station influence weight for the tract-season pair. All
          weights for a given tract and season sum to 1.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1

      - name: stations_used
        description: >
          Array of station identifiers contributing to the tract-season weighting.
          Provides full auditability and debugging visibility into the weighting
          process.
        tests:
          - not_null

    tests:
      - unique:
          column_name: "station || '-' || tract || '-' || season"
