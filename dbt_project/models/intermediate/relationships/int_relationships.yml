version: 2

models:
  - name: int_prevailing_wind_direction
    description: >
      Computes seasonal prevailing wind direction for each station using
      circular mean of LCDv2 hourly wind direction. Produces one row per
      station per season (DJF, MAM, JJA, SON). This model provides the
      climatological directional component used in the station-tract
      weighting system.

    columns:
      - name: station
        description: >
          WBAN station identifier. Used to join seasonal
          prevailing wind direction to geometry and weighting models.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_station_dim_enriched')
                field: station

      - name: season
        description: >
          Meteorological season assigned based on the month of each hourly
          observation. One of: DJF (winter), MAM (spring), JJA (summer),
          SON (fall). Used to align seasonal climatology with hourly weather
          records during weighting.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DJF', 'MAM', 'JJA', 'SON']

      - name: prevailing_wind_direction_deg
        description: >
          Circular-mean wind direction for the station during the given
          season, expressed in degrees (0-360). Represents the stable,
          climatological flow pattern used for wind-alignment weighting.
          If seasonal wind direction is not available, a station's overall
          prevailing wind direction is substituted as a fallback. If no 
          wind direction data is reported for a station, this value will 
          be NULL.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 360

    tests:
      - unique:
          column_name: "station || '-' || season"


  - name: int_tract_station_distance
    description: >
      Computes geometric relationships between every station and every census tract,
      including haversine distance, forward-azimuth bearing, and elevation difference.
      This model forms the static spatial foundation for all downstream weighting and
      tract-level aggregation.

    columns:
      - name: station
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_station_dim_enriched')
                field: station

      - name: tract
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tract_dim_enriched')
                field: tract

      - name: distance_m
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: bearing_deg
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 360

      - name: elevation_diff_m
        tests:
          - not_null

    tests:
      - unique:
          column_name: "station || '-' || tract"


  - name: int_station_weights
    description: >
      Computes seasonal station-to-tract influence weights using wind alignment,
      elevation penalty, and a linear distance taper applied only within a 50 km
      relevance threshold. Includes fallback logic for tracts without stations
      inside the threshold by selecting the nearest station. Produces normalized
      weights per station, tract, and season, along with an auditable record of
      all stations contributing to each tract-season weighting.

    columns:
      - name: station
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_station_dim_enriched')
                field: station

      - name: tract
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tract_dim_enriched')
                field: tract

      - name: season
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DJF', 'MAM', 'JJA', 'SON']

      - name: wind_alignment
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: elevation_penalty
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: distance_factor
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: raw_weight
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: final_weight
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: stations_used
        tests:
          - not_null

    tests:
      - unique:
          column_name: "station || '-' || tract || '-' || season"
