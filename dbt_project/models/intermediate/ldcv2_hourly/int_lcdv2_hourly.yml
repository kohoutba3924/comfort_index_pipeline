version: 2

models:
  - name: int_lcdv2_hourly
    description: >
      "Hourly station observations aggregated and extracted from sub-hourly LCDv2 data, 
      including correct precipitation extraction and circular wind direction averaging."
    columns:
      - name: station
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_station_dim_enriched')
                field: station

      - name: floored_timestamp
        description: "Timestamp of the hourly observation floored to the hour."
        tests:
          - not_null

      - name: dry_bulb_temp
        description: >
          Average dry bulb temperature from among subhourly records (°F).

      - name: wet_bulb_temp
        description: >
          Average wet bulb temperature from among subhourly records (°F).

      - name: dew_point_temp
        description: >
          Average dew point temperature from among subhourly records (°F).

      - name: relative_humidity
        description: >
          Average relative humidity from among subhourly records (%).

      - name: wind_speed
        description: >
          Average wind speed from among subhourly records (mph).

      - name: wind_direction
        description: >
          Average wind direction from among subhourly records (degrees).

      - name: wind_gust_speed
        description: >
          Max wind guest speed from among subhourly records (mph).

      - name: precipitation
        description: >
          Final intra-hour measurement from among subhourly records (inches).

      - name: visibility
        description: >
          Average visibility from among subhourly records (miles).

      - name: station_pressure
        description: >
          Average station pressure from among subhourly records (inHg).

      - name: barometric_pressure
        description: >
          Average barometric pressure from among subhourly records (inHg).


  - name: int_lcdv2_hourly_weighted
    description: >
      Produces tract-level hourly weather by applying normalized station-to-tract
      seasonal influence weights to LCDv2 hourly observations. Each hourly record
      is mapped to a meteorological season and joined to the appropriate station
      weights. Weather variables are aggregated using weighted sums, and wind
      direction is aggregated using a weighted circular mean. Includes full
      auditability of contributing stations.

    columns:
      - name: tract
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tract_dim_enriched')
                field: tract

      - name: floored_timestamp
        tests:
          - not_null

      - name: stations_used
        tests:
          - not_null

      - name: weighted_dry_bulb_temp

      - name: weighted_wet_bulb_temp

      - name: weighted_dew_point_temp

      - name: weighted_relative_humidity

      - name: weighted_wind_speed

      - name: weighted_wind_gust_speed

      - name: weighted_precipitation

      - name: weighted_visibility

      - name: weighted_station_pressure

      - name: weighted_barometric_pressure

      - name: weighted_wind_direction
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 360

    tests:
      - unique:
          column_name: "tract || '-' || floored_timestamp"


  - name: int_lcdv2_hourly_weighted_bucket_00
    description: "Bucket 00 of tract-level weighted hourly weather."
    columns:
      - name: tract
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tract_dim_enriched')
                field: tract

      - name: floored_timestamp
        tests:
          - not_null


  - name: int_lcdv2_hourly_weighted_bucket_01
